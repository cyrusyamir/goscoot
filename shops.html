<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local shops — GoScoot</title>
  <meta name="description" content="Discover independent local shops delivering in Lucknow with GoScoot.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛵</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#176B45', dark: '#0F4F32', light: '#E8F3EC' },
            lime: { DEFAULT: '#C6E86B', dark: '#A9D94D' },
            ink: '#202820',
            canvas: '#F8FAF6'
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-sans">
  <div id="site-header"></div>

  <main class="mx-auto max-w-7xl px-4">
    <section class="pt-8">
      <nav class="flex items-center gap-1.5 text-xs font-semibold text-slate-400">
        <a href="index.html" class="hover:text-brand">Home</a>
        <i data-lucide="chevron-right" class="h-3 w-3"></i>
        <span class="text-slate-600">Local shops</span>
      </nav>
      <div class="mt-3 flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
        <div>
          <h1 class="font-display text-2xl font-extrabold tracking-tight text-ink md:text-3xl">Local shops near you</h1>
          <p class="mt-1 max-w-2xl text-sm text-slate-500">
            Independent sellers across Lucknow. GoScoot picks up from their shop and delivers to your door.
          </p>
        </div>
        <div class="flex items-center gap-2">
          <label class="flex items-center gap-2 rounded-full border border-emerald-900/10 bg-white px-3 py-2 text-xs font-semibold text-slate-500">
            <i data-lucide="arrow-up-down" class="h-3.5 w-3.5 text-brand"></i>
            <select id="sortSelect" class="cursor-pointer bg-transparent font-semibold text-ink outline-none">
              <option value="rating">Top rated</option>
              <option value="eta">Fastest delivery</option>
              <option value="name">Name A–Z</option>
            </select>
          </label>
        </div>
      </div>

      <div class="no-scrollbar mt-5 flex gap-2 overflow-x-auto pb-1" id="filterChips"></div>

      <p id="resultCount" class="mt-5 text-xs font-semibold uppercase tracking-wider text-slate-400"></p>
      <div id="shopGrid" class="mt-3 grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/seed.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pages/shops.js"></script>
</body>
</html>
